name: KhipuVault withdrawal regression

on:
  push:
    branches:
      - ci/khipuvault-withdrawal-regression
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Foundry regression test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this PoC harness
        uses: actions/checkout@v4

      - name: Checkout KhipuVault at reviewed commit
        uses: actions/checkout@v4
        with:
          repository: Ande-Labs/KhipuVault
          ref: c069cf9f0219868fed81b78aeebf3caa5102d26b
          path: target
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Inject isolated regression test
        run: |
          cp KhipuVaultFullWithdrawalPendingYieldRegression.t.sol \
            target/packages/contracts/test/KhipuVaultFullWithdrawalPendingYieldRegression.t.sol

      - name: Compare deployed implementation bytecode with reviewed source build
        working-directory: target/packages/contracts
        env:
          RPC_URL: https://rpc.test.mezo.org
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          slot = "0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc"
          targets = [
              ("IndividualPoolV3", "0xdfBEd2D3efBD2071fD407bF169b5e5533eA90393"),
              ("YieldAggregatorV3", "0x3D28a5eF59Cf3ab8E2E11c0A8031373D46370BE6"),
          ]

          def cast(*args):
              return subprocess.check_output(
                  ["cast", *args, "--rpc-url", "https://rpc.test.mezo.org"],
                  text=True
              ).strip()

          for contract, proxy in targets:
              word = cast("storage", proxy, slot)
              implementation = "0x" + word[-40:]
              deployed = cast("code", implementation).lower()
              artifact_path = Path("out") / f"{contract}.sol" / f"{contract}.json"
              artifact = json.loads(artifact_path.read_text())
              compiled = artifact["deployedBytecode"]["object"].lower()
              if compiled.startswith("0x"):
                  compiled = compiled[2:]
              if deployed.startswith("0x"):
                  deployed = deployed[2:]
              if deployed != compiled:
                  raise SystemExit(
                      f"MISMATCH: {contract} proxy {proxy}, implementation {implementation}; "
                      f"deployed bytes={len(deployed)//2}, compiled bytes={len(compiled)//2}"
                  )
              print(f"MATCH: {contract} proxy {proxy} -> implementation {implementation}")
              print(f"Exact runtime bytecode match: {len(deployed)//2} bytes")
          PY

      - name: Run targeted regression
        working-directory: target/packages/contracts
        run: |
          forge --version
          forge test \
            --match-path test/KhipuVaultFullWithdrawalPendingYieldRegression.t.sol \
            -vvv

  deployment-source-check:
    name: Read-only Mezo deployment check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect deployed proxies
        env:
          RPC_URL: https://rpc.test.mezo.org
        run: |
          set -euo pipefail
          POOL=0xdfBEd2D3efBD2071fD407bF169b5e5533eA90393
          AGG=0x3D28a5eF59Cf3ab8E2E11c0A8031373D46370BE6
          SLOT=0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc
          echo "Mezo chain ID:"
          cast chain-id --rpc-url "$RPC_URL"
          for ADDRESS in "$POOL" "$AGG"; do
            echo "=== Proxy $ADDRESS ==="
            CODE=$(cast code "$ADDRESS" --rpc-url "$RPC_URL")
            echo "Proxy runtime bytes: $(( (${#CODE} - 2) / 2 ))"
            WORD=$(cast storage "$ADDRESS" "$SLOT" --rpc-url "$RPC_URL")
            IMPL="0x${WORD: -40}"
            echo "EIP-1967 implementation: $IMPL"
            IMPL_CODE=$(cast code "$IMPL" --rpc-url "$RPC_URL")
            echo "Implementation runtime bytes: $(( (${#IMPL_CODE} - 2) / 2 ))"
            echo "Implementation runtime keccak256:"
            cast keccak "$IMPL_CODE"
          done
